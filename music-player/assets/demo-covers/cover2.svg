<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#0d2b45" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" fill="url(#cyberBg)" />
  
  <!-- Cyber Circles -->
  <circle cx="250" cy="230" r="160" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="2" />
  <circle cx="250" cy="230" r="130" fill="none" stroke="rgba(59, 130, 246, 0.3)" stroke-width="4" stroke-dasharray="10, 15" />
  <circle cx="250" cy="230" r="90" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="3" filter="url(#neonGlow)" />
  
  <!-- Waveform lines -->
  <path d="M 120 230 Q 150 160 180 230 T 240 230 T 300 230 T 380 230" fill="none" stroke="#22d3ee" stroke-width="4" filter="url(#neonGlow)" />
  <path d="M 100 230 Q 140 280 180 230 T 260 230 T 340 230 T 400 230" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.8" />

  <!-- Geometric Accents -->
  <polygon points="250,90 280,140 220,140" fill="#06b6d4" filter="url(#neonGlow)" />
  <polygon points="250,370 280,320 220,320" fill="#a855f7" filter="url(#neonGlow)" />
  
  <!-- Title -->
  <text x="250" y="450" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="26" letter-spacing="5">CYBERDRIVE 2077</text>
</svg>
