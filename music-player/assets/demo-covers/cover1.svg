<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" />
  
  <!-- Glowing Sun -->
  <circle cx="250" cy="220" r="110" fill="url(#sunGrad)" filter="drop-shadow(0 0 40px #f97316)" />
  
  <!-- Sun horizontal cuts -->
  <rect x="140" y="240" width="220" height="6" fill="#7c3aed" opacity="0.8" />
  <rect x="150" y="255" width="200" height="8" fill="#7c3aed" opacity="0.85" />
  <rect x="165" y="272" width="170" height="10" fill="#7c3aed" opacity="0.9" />
  <rect x="185" y="292" width="130" height="12" fill="#7c3aed" opacity="0.95" />

  <!-- Mountains -->
  <polygon points="40,360 170,240 290,360" fill="#1e1b4b" opacity="0.9" />
  <polygon points="210,360 340,220 460,360" fill="#0f172a" opacity="0.95" />
  
  <!-- Grid Horizon Floor -->
  <rect x="0" y="340" width="500" height="160" fill="#090a0f" />
  <path d="M0,340 L500,340 M0,365 L500,365 M0,395 L500,395 M0,435 L500,435 M0,490 L500,490" stroke="url(#gridGrad)" stroke-width="2" />
  <path d="M250,340 L250,500 M200,340 L120,500 M300,340 L380,500 M150,340 L-10,500 M350,340 L510,500 M100,340 L-150,500 M400,340 L650,500" stroke="url(#gridGrad)" stroke-width="2" />

  <!-- Title Overlay -->
  <text x="250" y="470" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" letter-spacing="4">SUMMER LO-FI</text>
</svg>
